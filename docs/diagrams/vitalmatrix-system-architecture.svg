<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1120" viewBox="0 0 1160 1120" role="img" aria-labelledby="report-title report-desc">
  <title id="report-title">VitalMatrix 系统架构</title>
  <desc id="report-desc">VitalMatrix 客户端、FastAPI 核心、服务层、数据层与外部服务架构图</desc>
  <style>.report-title{fill:#f8fafc;font:700 30px "JetBrains Mono","Droid Sans",sans-serif}.report-sub{fill:#94a3b8;font:14px "JetBrains Mono","Droid Sans",sans-serif}.report-tag{fill:#22d3ee;font:12px "JetBrains Mono","Droid Sans",sans-serif;letter-spacing:.12em}.card-title{font:700 16px "JetBrains Mono","Droid Sans",sans-serif}.card-text{fill:#cbd5e1;font:12px "JetBrains Mono","Droid Sans",sans-serif}.footer-text{fill:#64748b;font:11px "JetBrains Mono","Droid Sans",sans-serif}</style>
  <defs><pattern id="report-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs>
  <rect width="1160" height="1120" rx="18" fill="#020617"/>
  <rect width="1160" height="1120" rx="18" fill="url(#report-grid)"/>
  <text class="report-tag" x="38" y="42">VITALMATRIX / 系统架构</text>
  <text class="report-title" x="38" y="82">个人健康智能平台</text>
  <text class="report-sub" x="38" y="112">统一 FastAPI 核心连接多端客户端、健康数据服务、分阶段 AI 工作流与私有媒体存储。</text>
  <g transform="translate(0 140)">

  <style>text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Droid Sans",sans-serif}.boundary{fill:#0f172a;fill-opacity:.38;stroke:#475569;stroke-width:1.5;stroke-dasharray:8 7}.boundary-label{fill:#94a3b8;font-size:12px;letter-spacing:.12em}.node{stroke-width:1.5}.node-title{fill:#f8fafc;font-size:13px;font-weight:700}.node-sub{fill:#94a3b8;font-size:10px}.label{fill:#cbd5e1;font-size:10px}.arrow{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.arrow-dashed{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  <defs><pattern id="preview-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs>
  <rect width="1160" height="760" rx="14" fill="#020617"/>
  <rect width="1160" height="760" rx="14" fill="url(#preview-grid)"/>
        <title id="diagram-title">VitalMatrix system architecture</title><desc id="diagram-desc">Clients connect through Nginx to FastAPI APIs, services, data stores, and external health and AI providers.</desc>
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>

        <!-- Connections are intentionally painted first, behind opaque component cards. -->
        <path class="arrow" d="M150 145H205V274H245"/><path class="arrow" d="M150 265H205V274H245"/><path class="arrow" d="M150 385H205V274H245"/>
        <path class="arrow" d="M375 274H415V145H450"/><path class="arrow" d="M375 274H415V275H450"/><path class="arrow" d="M375 274H415V405H450"/>
        <path class="arrow" d="M590 145H625V125H655"/><path class="arrow" d="M590 145H625V235H655"/><path class="arrow" d="M590 275H625V235H655"/><path class="arrow" d="M590 275H625V345H655"/><path class="arrow" d="M590 405H625V455H655"/><path class="arrow-dashed" d="M590 535H625V455H655"/>
        <path class="arrow" d="M795 125H835V145H875"/><path class="arrow" d="M795 235H835V255H875"/><path class="arrow" d="M795 345H835V365H875"/><path class="arrow" d="M795 455H835V475H875"/>
        <path class="arrow" d="M795 125V88H1040V125H1070"/><path class="arrow" d="M795 345H820V205H1040V235H1070"/><path class="arrow" d="M590 145H610V188H1025V345H1070"/><path class="arrow-dashed" d="M1005 475H1040V455H1070"/>

        <rect class="boundary" x="225" y="55" width="800" height="555" rx="18"/><text class="boundary-label" x="245" y="82">服务器信任边界</text>

        <text class="boundary-label" x="35" y="95">客户端</text>
        <g><rect class="node" x="30" y="115" width="120" height="60" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="45" y="140">React Web</text><text class="node-sub" x="45" y="158">Vite 仪表盘</text></g>
        <g><rect class="node" x="30" y="235" width="120" height="60" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="45" y="260">微信小程序</text><text class="node-sub" x="45" y="278">微信客户端</text></g>
        <g><rect class="node" x="30" y="355" width="120" height="60" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="45" y="380">Agent 客户端</text><text class="node-sub" x="45" y="398">MCP / OpenClaw</text></g>

        <g><rect class="node" x="245" y="239" width="130" height="70" rx="10" fill="#0f172a" stroke="#94a3b8"/><text class="node-title" x="263" y="266">Nginx 接入层</text><text class="node-sub" x="263" y="284">TLS · 静态资源 · 反向代理</text></g>

        <text class="boundary-label" x="450" y="105">FASTAPI 核心</text>
        <g><rect class="node" x="450" y="115" width="140" height="60" rx="10" fill="#4c0519" stroke="#fb7185"/><text class="node-title" x="468" y="140">认证与策略</text><text class="node-sub" x="468" y="158">JWT · API Key · 权限控制</text></g>
        <g><rect class="node" x="450" y="245" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="468" y="270">REST API</text><text class="node-sub" x="468" y="288">/api/v1/*</text></g>
        <g><rect class="node" x="450" y="375" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="468" y="400">MCP 服务</text><text class="node-sub" x="468" y="418">SSE · 数据工具</text></g>
        <g><rect class="node" x="450" y="505" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="468" y="530">任务调度</text><text class="node-sub" x="468" y="548">同步 · 汇总 · 清理</text></g>

        <text class="boundary-label" x="655" y="85">服务层</text>
        <g><rect class="node" x="655" y="95" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="673" y="120">健康业务</text><text class="node-sub" x="673" y="138">训练 · 恢复</text></g>
        <g><rect class="node" x="655" y="205" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="673" y="230">营养流程</text><text class="node-sub" x="673" y="248">本餐分析 · 三餐建议 · 海报</text></g>
        <g><rect class="node" x="655" y="315" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="673" y="340">AI 编排</text><text class="node-sub" x="673" y="358">Schema · 重试 · 路由</text></g>
        <g><rect class="node" x="655" y="425" width="140" height="60" rx="10" fill="#4c0519" stroke="#fb7185"/><text class="node-title" x="673" y="450">私有媒体</text><text class="node-sub" x="673" y="468">签名访问 · 过期控制</text></g>

        <text class="boundary-label" x="875" y="105">数据层</text>
        <g><rect class="node" x="875" y="115" width="130" height="60" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="893" y="140">PostgreSQL</text><text class="node-sub" x="893" y="158">主数据存储</text></g>
        <g><rect class="node" x="875" y="225" width="130" height="60" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="893" y="250">Redis</text><text class="node-sub" x="893" y="268">锁 · 限流 · 缓存</text></g>
        <g><rect class="node" x="875" y="335" width="130" height="60" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="893" y="360">文件存储</text><text class="node-sub" x="893" y="378">私有原图</text></g>
        <g><rect class="node" x="875" y="445" width="130" height="60" rx="10" fill="#0f172a" stroke="#94a3b8"/><text class="node-title" x="893" y="470">运行保障</text><text class="node-sub" x="893" y="488">日志 · 健康检查</text></g>

        <text class="boundary-label" x="1070" y="85">外部服务</text>
        <g><rect class="node" x="1070" y="95" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="120">Polar</text><text class="node-sub" x="1082" y="138">Oura</text></g>
        <g><rect class="node" x="1070" y="205" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="230">Vertex</text><text class="node-sub" x="1082" y="248">Gemini</text></g>
        <g><rect class="node" x="1070" y="315" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="340">WeChat</text><text class="node-sub" x="1082" y="358">认证</text></g>
        <g><rect class="node" x="1070" y="425" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="450">通知</text><text class="node-sub" x="1082" y="468">可选</text></g>

        <g transform="translate(245 664)"><text class="boundary-label" x="0" y="0">图例</text><rect x="0" y="18" width="12" height="12" rx="2" fill="#082f49" stroke="#22d3ee"/><text class="label" x="20" y="28">前端</text><rect x="110" y="18" width="12" height="12" rx="2" fill="#022c22" stroke="#34d399"/><text class="label" x="130" y="28">后端</text><rect x="220" y="18" width="12" height="12" rx="2" fill="#2e1065" stroke="#a78bfa"/><text class="label" x="240" y="28">数据</text><rect x="310" y="18" width="12" height="12" rx="2" fill="#451a03" stroke="#fbbf24"/><text class="label" x="330" y="28">云服务 / 外部服务</text><rect x="475" y="18" width="12" height="12" rx="2" fill="#4c0519" stroke="#fb7185"/><text class="label" x="495" y="28">安全边界</text></g>

  </g>
  <g transform="translate(30 935)">
    <rect width="350" height="125" rx="12" fill="#0f172a" stroke="#164e63"/>
    <circle cx="24" cy="25" r="5" fill="#22d3ee"/><text class="card-title" x="40" y="31" fill="#22d3ee">一个核心，三类客户端</text>
    <text class="card-text" x="20" y="62"><tspan x="20" dy="0">Web、微信小程序和 MCP 客户端共享</tspan><tspan x="20" dy="22">统一认证、服务接口与健康数据模型。</tspan></text>
  </g>
  <g transform="translate(405 935)">
    <rect width="350" height="125" rx="12" fill="#0f172a" stroke="#065f46"/>
    <circle cx="24" cy="25" r="5" fill="#34d399"/><text class="card-title" x="40" y="31" fill="#34d399">分阶段 AI 工作流</text>
    <text class="card-text" x="20" y="62"><tspan x="20" dy="0">结构化分析、三餐建议和海报生成相互</tspan><tspan x="20" dy="22">独立，每个阶段都会持久化并可追踪。</tspan></text>
  </g>
  <g transform="translate(780 935)">
    <rect width="350" height="125" rx="12" fill="#0f172a" stroke="#881337"/>
    <circle cx="24" cy="25" r="5" fill="#fb7185"/><text class="card-title" x="40" y="31" fill="#fb7185">默认私有</text>
    <text class="card-text" x="20" y="62"><tspan x="20" dy="0">健康数据和上传媒体默认受应用授权保护，</tspan><tspan x="20" dy="22">对外访问只使用短时有效的签名地址。</tspan></text>
  </g>
  <text class="footer-text" x="30" y="1095">VitalMatrix 架构基线 · 2026-08-22</text>
  <text class="footer-text" x="1130" y="1095" text-anchor="end">完整画布 · PNG / PDF 导出</text>
</svg>
