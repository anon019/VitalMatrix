<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="diagram-title diagram-desc">
  <style>text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}.boundary{fill:#0f172a;fill-opacity:.38;stroke:#475569;stroke-width:1.5;stroke-dasharray:8 7}.boundary-label{fill:#94a3b8;font-size:12px;letter-spacing:.12em}.node{stroke-width:1.5}.node-title{fill:#f8fafc;font-size:13px;font-weight:700}.node-sub{fill:#94a3b8;font-size:10px}.label{fill:#cbd5e1;font-size:10px}.arrow{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.arrow-dashed{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  <defs><pattern id="preview-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs>
  <rect width="1160" height="760" rx="14" fill="#020617"/>
  <rect width="1160" height="760" rx="14" fill="url(#preview-grid)"/>
        <title id="diagram-title">VitalMatrix system architecture</title><desc id="diagram-desc">Clients connect through Nginx to FastAPI APIs, services, data stores, and external health and AI providers.</desc>
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>

        <!-- Connections are intentionally painted first, behind opaque component cards. -->
        <path class="arrow" d="M150 145H205V274H245"/><path class="arrow" d="M150 265H205V274H245"/><path class="arrow" d="M150 385H205V274H245"/>
        <path class="arrow" d="M375 274H415V145H450"/><path class="arrow" d="M375 274H415V275H450"/><path class="arrow" d="M375 274H415V405H450"/>
        <path class="arrow" d="M590 145H625V125H655"/><path class="arrow" d="M590 145H625V235H655"/><path class="arrow" d="M590 275H625V235H655"/><path class="arrow" d="M590 275H625V345H655"/><path class="arrow" d="M590 405H625V455H655"/><path class="arrow-dashed" d="M590 535H625V455H655"/>
        <path class="arrow" d="M795 125H835V145H875"/><path class="arrow" d="M795 235H835V255H875"/><path class="arrow" d="M795 345H835V365H875"/><path class="arrow" d="M795 455H835V475H875"/>
        <path class="arrow" d="M795 125V88H1040V125H1070"/><path class="arrow" d="M795 345H820V205H1040V235H1070"/><path class="arrow" d="M590 145H610V188H1025V345H1070"/><path class="arrow-dashed" d="M1005 475H1040V455H1070"/>

        <rect class="boundary" x="225" y="55" width="800" height="555" rx="18"/><text class="boundary-label" x="245" y="82">SERVER TRUST BOUNDARY</text>

        <text class="boundary-label" x="35" y="95">CLIENTS</text>
        <g><rect class="node" x="30" y="115" width="120" height="60" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="45" y="140">React Web</text><text class="node-sub" x="45" y="158">Vite dashboard</text></g>
        <g><rect class="node" x="30" y="235" width="120" height="60" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="45" y="260">Mini Program</text><text class="node-sub" x="45" y="278">WeChat client</text></g>
        <g><rect class="node" x="30" y="355" width="120" height="60" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="45" y="380">Agent Client</text><text class="node-sub" x="45" y="398">MCP / OpenClaw</text></g>

        <g><rect class="node" x="245" y="239" width="130" height="70" rx="10" fill="#0f172a" stroke="#94a3b8"/><text class="node-title" x="263" y="266">Nginx Edge</text><text class="node-sub" x="263" y="284">TLS · static · proxy</text></g>

        <text class="boundary-label" x="450" y="105">FASTAPI CORE</text>
        <g><rect class="node" x="450" y="115" width="140" height="60" rx="10" fill="#4c0519" stroke="#fb7185"/><text class="node-title" x="468" y="140">Auth &amp; Policy</text><text class="node-sub" x="468" y="158">JWT · API key · limits</text></g>
        <g><rect class="node" x="450" y="245" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="468" y="270">REST APIs</text><text class="node-sub" x="468" y="288">/api/v1/*</text></g>
        <g><rect class="node" x="450" y="375" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="468" y="400">MCP Server</text><text class="node-sub" x="468" y="418">SSE + data tools</text></g>
        <g><rect class="node" x="450" y="505" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="468" y="530">Scheduler</text><text class="node-sub" x="468" y="548">sync · digest · cleanup</text></g>

        <text class="boundary-label" x="655" y="85">SERVICES</text>
        <g><rect class="node" x="655" y="95" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="673" y="120">Health Domain</text><text class="node-sub" x="673" y="138">training · recovery</text></g>
        <g><rect class="node" x="655" y="205" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="673" y="230">Nutrition Flow</text><text class="node-sub" x="673" y="248">core · advice · poster</text></g>
        <g><rect class="node" x="655" y="315" width="140" height="60" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="673" y="340">AI Orchestrator</text><text class="node-sub" x="673" y="358">schema · retry · routing</text></g>
        <g><rect class="node" x="655" y="425" width="140" height="60" rx="10" fill="#4c0519" stroke="#fb7185"/><text class="node-title" x="673" y="450">Private Media</text><text class="node-sub" x="673" y="468">signed access · expiry</text></g>

        <text class="boundary-label" x="875" y="105">DATA</text>
        <g><rect class="node" x="875" y="115" width="130" height="60" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="893" y="140">PostgreSQL</text><text class="node-sub" x="893" y="158">system of record</text></g>
        <g><rect class="node" x="875" y="225" width="130" height="60" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="893" y="250">Redis</text><text class="node-sub" x="893" y="268">locks · rate · cache</text></g>
        <g><rect class="node" x="875" y="335" width="130" height="60" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="893" y="360">File Storage</text><text class="node-sub" x="893" y="378">private originals</text></g>
        <g><rect class="node" x="875" y="445" width="130" height="60" rx="10" fill="#0f172a" stroke="#94a3b8"/><text class="node-title" x="893" y="470">Operations</text><text class="node-sub" x="893" y="488">logs · health checks</text></g>

        <text class="boundary-label" x="1070" y="85">EXTERNAL</text>
        <g><rect class="node" x="1070" y="95" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="120">Polar</text><text class="node-sub" x="1082" y="138">Oura</text></g>
        <g><rect class="node" x="1070" y="205" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="230">Vertex</text><text class="node-sub" x="1082" y="248">Gemini</text></g>
        <g><rect class="node" x="1070" y="315" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="340">WeChat</text><text class="node-sub" x="1082" y="358">Auth</text></g>
        <g><rect class="node" x="1070" y="425" width="70" height="60" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="1082" y="450">Alerts</text><text class="node-sub" x="1082" y="468">optional</text></g>

        <g transform="translate(245 664)"><text class="boundary-label" x="0" y="0">LEGEND</text><rect x="0" y="18" width="12" height="12" rx="2" fill="#082f49" stroke="#22d3ee"/><text class="label" x="20" y="28">Frontend</text><rect x="110" y="18" width="12" height="12" rx="2" fill="#022c22" stroke="#34d399"/><text class="label" x="130" y="28">Backend</text><rect x="220" y="18" width="12" height="12" rx="2" fill="#2e1065" stroke="#a78bfa"/><text class="label" x="240" y="28">Data</text><rect x="310" y="18" width="12" height="12" rx="2" fill="#451a03" stroke="#fbbf24"/><text class="label" x="330" y="28">Cloud / external</text><rect x="475" y="18" width="12" height="12" rx="2" fill="#4c0519" stroke="#fb7185"/><text class="label" x="495" y="28">Security boundary</text></g>
      </svg>
