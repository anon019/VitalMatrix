  <script>
    const report=document.getElementById("report-container");
    const padding=32;
    function toggleToolbar(){document.getElementById("toolbar").classList.toggle("open")}
    async function captureReport(){const rect=report.getBoundingClientRect();return html2canvas(document.body,{backgroundColor:"#020617",scale:2,x:rect.left+window.scrollX-padding,y:rect.top+window.scrollY-padding,width:rect.width+padding*2,height:rect.height+padding*2,windowWidth:document.documentElement.scrollWidth,windowHeight:document.documentElement.scrollHeight,ignoreElements:element=>element.classList&&element.classList.contains("toolbar")})}
    async function copyAsImage(){const canvas=await captureReport();canvas.toBlob(async blob=>{if(!blob)return;await navigator.clipboard.write([new ClipboardItem({"image/png":blob})])},"image/png")}
    async function downloadPNG(){const canvas=await captureReport();const link=document.createElement("a");link.download="vitalmatrix-system-architecture.png";link.href=canvas.toDataURL("image/png");link.click()}
    async function downloadPDF(){const canvas=await captureReport();const {jsPDF}=window.jspdf;const orientation=canvas.width>=canvas.height?"landscape":"portrait";const pdf=new jsPDF({orientation,unit:"px",format:[canvas.width,canvas.height],hotfixes:["px_scaling"]});pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,canvas.width,canvas.height);pdf.save("vitalmatrix-system-architecture.pdf")}
    document.addEventListener("click",event=>{const toolbar=document.getElementById("toolbar");if(!toolbar.contains(event.target))toolbar.classList.remove("open")});
  </script>
