<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="820" viewBox="0 0 1160 820" role="img" aria-labelledby="flow-title flow-desc">
  <style>text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}.lane{fill:#0f172a;fill-opacity:.72;stroke:#334155;stroke-width:1.2}.lane-title{fill:#64748b;font-size:11px;letter-spacing:.12em}.node{stroke-width:1.5}.node-title{fill:#f8fafc;font-size:12px;font-weight:700}.node-sub{fill:#94a3b8;font-size:9.5px}.step{fill:#020617;stroke-width:1.5}.step-text{fill:#f8fafc;font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.arrow{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}.arrow-dashed{fill:none;stroke:#fb7185;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow-rose)}.arrow-label{fill:#94a3b8;font-size:9px}.legend{fill:#cbd5e1;font-size:10px}</style>
  <defs><pattern id="preview-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern></defs>
  <rect width="1160" height="820" rx="14" fill="#020617"/>
  <rect width="1160" height="820" rx="14" fill="url(#preview-grid)"/>
        <title id="flow-title">Nutrition analysis and poster generation workflow</title><desc id="flow-desc">The client uploads a meal, the backend performs staged structured analysis and recommendations, and creates a deterministic poster when requested.</desc>
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker></defs>

        <!-- Workflow connections first so cards mask lines and keep labels readable. -->
        <path class="arrow" d="M210 137H280"/><path class="arrow" d="M450 137H520"/><path class="arrow" d="M690 137H760"/><path class="arrow" d="M930 137H1000"/>
        <path class="arrow" d="M1075 174V260H930"/><path class="arrow" d="M760 307H690"/><path class="arrow" d="M520 307H450"/><path class="arrow" d="M280 307H210"/>
        <path class="arrow" d="M135 344V430H280"/><path class="arrow" d="M450 477H520"/><path class="arrow" d="M690 477H760"/><path class="arrow" d="M930 477H1000"/>
        <path class="arrow" d="M1075 514V600H930"/><path class="arrow" d="M760 647H690"/><path class="arrow" d="M520 647H450"/>
        <path class="arrow-dashed" d="M605 684V732H365V684"/><text class="arrow-label" x="465" y="725">bounded retry / visible failure state</text>

        <rect class="lane" x="35" y="70" width="1090" height="130" rx="16"/><text class="lane-title" x="55" y="96">01 · CAPTURE &amp; CORE ANALYSIS</text>
        <rect class="lane" x="35" y="240" width="1090" height="130" rx="16"/><text class="lane-title" x="55" y="266">02 · ASYNC FUTURE-MEAL RECOMMENDATION</text>
        <rect class="lane" x="35" y="410" width="1090" height="130" rx="16"/><text class="lane-title" x="55" y="436">03 · ON-DEMAND POSTER GENERATION</text>
        <rect class="lane" x="35" y="580" width="1090" height="130" rx="16"/><text class="lane-title" x="55" y="606">04 · PRIVATE DELIVERY &amp; OBSERVABILITY</text>

        <g><circle class="step" cx="60" cy="137" r="15" stroke="#22d3ee"/><text class="step-text" x="60" y="137">1</text><rect class="node" x="75" y="105" width="135" height="64" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="91" y="132">Upload Meal</text><text class="node-sub" x="91" y="151">Web / Mini Program</text></g>
        <g><circle class="step" cx="265" cy="137" r="15" stroke="#34d399"/><text class="step-text" x="265" y="137">2</text><rect class="node" x="280" y="105" width="170" height="64" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="296" y="128">Validate &amp; Normalize</text><text class="node-sub" x="296" y="147">EXIF · JPEG · thumbnail</text></g>
        <g><circle class="step" cx="505" cy="137" r="15" stroke="#a78bfa"/><text class="step-text" x="505" y="137">3</text><rect class="node" x="520" y="105" width="170" height="64" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="536" y="128">Private Storage</text><text class="node-sub" x="536" y="147">original + thumbnail</text></g>
        <g><circle class="step" cx="745" cy="137" r="15" stroke="#fbbf24"/><text class="step-text" x="745" y="137">4</text><rect class="node" x="760" y="105" width="170" height="64" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="776" y="128">Gemini Core</text><text class="node-sub" x="776" y="147">structured JSON schema</text></g>
        <g><circle class="step" cx="985" cy="137" r="15" stroke="#a78bfa"/><text class="step-text" x="985" y="137">5</text><rect class="node" x="1000" y="105" width="110" height="64" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="1016" y="128">Persist</text><text class="node-sub" x="1016" y="147">meal + macros</text></g>

        <g><circle class="step" cx="945" cy="307" r="15" stroke="#34d399"/><text class="step-text" x="945" y="307">6</text><rect class="node" x="760" y="275" width="170" height="64" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="776" y="298">Queue Advice Stage</text><text class="node-sub" x="776" y="317">core response is ready</text></g>
        <g><circle class="step" cx="705" cy="307" r="15" stroke="#a78bfa"/><text class="step-text" x="705" y="307">7</text><rect class="node" x="520" y="275" width="170" height="64" rx="10" fill="#2e1065" stroke="#a78bfa"/><text class="node-title" x="536" y="298">7-Day Context</text><text class="node-sub" x="536" y="317">history + daily totals</text></g>
        <g><circle class="step" cx="465" cy="307" r="15" stroke="#fbbf24"/><text class="step-text" x="465" y="307">8</text><rect class="node" x="280" y="275" width="170" height="64" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="296" y="298">Text Recommendation</text><text class="node-sub" x="296" y="317">exactly 3 future meals</text></g>
        <g><circle class="step" cx="225" cy="307" r="15" stroke="#22d3ee"/><text class="step-text" x="225" y="307">9</text><rect class="node" x="75" y="275" width="135" height="64" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="91" y="298">Status Poll</text><text class="node-sub" x="91" y="317">progressive UI update</text></g>

        <g><circle class="step" cx="265" cy="477" r="15" stroke="#22d3ee"/><text class="step-text" x="265" y="477">10</text><rect class="node" x="280" y="445" width="170" height="64" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="296" y="468">Generate Poster</text><text class="node-sub" x="296" y="487">explicit user action</text></g>
        <g><circle class="step" cx="505" cy="477" r="15" stroke="#34d399"/><text class="step-text" x="505" y="477">11</text><rect class="node" x="520" y="445" width="170" height="64" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="536" y="468">Digest &amp; Limit</text><text class="node-sub" x="536" y="487">cache · daily quota</text></g>
        <g><circle class="step" cx="745" cy="477" r="15" stroke="#fbbf24"/><text class="step-text" x="745" y="477">12</text><rect class="node" x="760" y="445" width="170" height="64" rx="10" fill="#451a03" stroke="#fbbf24"/><text class="node-title" x="776" y="468">AI Visual Layer</text><text class="node-sub" x="776" y="487">3:4 · image only</text></g>
        <g><circle class="step" cx="985" cy="477" r="15" stroke="#34d399"/><text class="step-text" x="985" y="477">13</text><rect class="node" x="1000" y="445" width="110" height="64" rx="10" fill="#022c22" stroke="#34d399"/><text class="node-title" x="1016" y="466">Compose</text><text class="node-sub" x="1016" y="484">text + metrics</text><text class="node-sub" x="1016" y="498">+ meal labels</text></g>

        <g><circle class="step" cx="945" cy="647" r="15" stroke="#fb7185"/><text class="step-text" x="945" y="647">14</text><rect class="node" x="760" y="615" width="170" height="64" rx="10" fill="#4c0519" stroke="#fb7185"/><text class="node-title" x="776" y="638">Signed Poster URL</text><text class="node-sub" x="776" y="657">private · short-lived</text></g>
        <g><circle class="step" cx="705" cy="647" r="15" stroke="#22d3ee"/><text class="step-text" x="705" y="647">15</text><rect class="node" x="520" y="615" width="170" height="64" rx="10" fill="#082f49" stroke="#22d3ee"/><text class="node-title" x="536" y="638">Preview &amp; Save</text><text class="node-sub" x="536" y="657">client share flow</text></g>
        <g><circle class="step" cx="465" cy="647" r="15" stroke="#94a3b8"/><text class="step-text" x="465" y="647">16</text><rect class="node" x="280" y="615" width="170" height="64" rx="10" fill="#0f172a" stroke="#94a3b8"/><text class="node-title" x="296" y="638">Trace &amp; Status</text><text class="node-sub" x="296" y="657">stage-aware diagnostics</text></g>

        <g transform="translate(55 772)"><text class="lane-title" x="0" y="0">LEGEND</text><rect x="90" y="-11" width="12" height="12" rx="2" fill="#082f49" stroke="#22d3ee"/><text class="legend" x="110" y="0">Client</text><rect x="190" y="-11" width="12" height="12" rx="2" fill="#022c22" stroke="#34d399"/><text class="legend" x="210" y="0">Backend</text><rect x="310" y="-11" width="12" height="12" rx="2" fill="#2e1065" stroke="#a78bfa"/><text class="legend" x="330" y="0">Data</text><rect x="405" y="-11" width="12" height="12" rx="2" fill="#451a03" stroke="#fbbf24"/><text class="legend" x="425" y="0">AI / cloud</text><rect x="540" y="-11" width="12" height="12" rx="2" fill="#4c0519" stroke="#fb7185"/><text class="legend" x="560" y="0">Private delivery</text></g>
      </svg>
