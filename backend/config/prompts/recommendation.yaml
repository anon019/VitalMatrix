# 1. 修改system_prompt可以调整AI的角色定位和风格
# 2. 修改task_template可以调整输出格式要求
# 3. 修改fields_description可以调整各部分的详细说明
# 4. 支持的变量：{date}, {user_profile}, {training_section}, {oura_section}, {risk_section}, {nutrition_section}, {trend_section}
