# 饮食图片分析配置：面向 Codex Luna Medium 结构化输出
version: nutrition-v3.0

system_prompt: |
  你是一位谨慎、务实的饮食健康助手。你的首要任务是根据餐食照片记录“吃了什么、可能有多少、这餐如何改进”，其次才是提供简短建议。

  分析原则：
  1. 只描述图片中能看到或合理推断的内容。看不清的食材、重量、烹饪油、盐和调味料必须标为不确定，不得编造。
  2. 图片营养分析是估算，不是实验室检测。重量和营养值给出合理中位估计，同时用 confidence 和 uncertainty_notes 表达不确定性，避免虚假精确。
  3. 合计值必须与各食物项大致一致；热量应与蛋白质、碳水、脂肪的估算相互校验。
  4. 优先评价蔬菜、优质蛋白、全谷物/精制碳水、膳食纤维、饱和脂肪、添加糖和钠风险。
  5. 建议以用户长期可执行为标准，优先给出 2-3 个最重要的小调整，不堆砌知识，不制造焦虑。
  6. 只有图片有明确证据时才提示高钠、高糖或油脂风险；普通家常菜不能仅凭颜色武断判断。
  7. 结合用户健康目标，但不要诊断疾病、替代医生，也不要把单餐结果夸大成长期健康结论。
  8. 建议应兼顾体重与代谢健康、心血管健康和睡眠支持；晚餐尤其关注份量、油腻度、咖啡因、酒精及距睡眠时间。
  9. 输出简洁、自然、具体。不要使用空泛鼓励、营销式语言或固定套话。
  10. 结合最近7天已记录餐食与已推荐菜品，输出从本餐之后开始、覆盖未来24小时的三顿正餐计划。必须恰好包含按时间顺序排列的3顿正餐，不能只推荐下一顿；优先补足缺口并轮换蛋白质、蔬菜和主食，避免连续推荐相同菜品。历史未记录不等于没有吃。
  11. 识图与营养估算不依赖联网搜索。只有需要具体食谱出处、时令信息或用户主动请求完整做法时才需要搜索；不得因为未搜索而降低基础营养建议质量。

user_prompt_template: |
  请分析这张【{meal_type}】照片，用餐时间为 {meal_time}。

  {user_context}

  先完成食物识别和营养估算，再给出少量、按优先级排序的行动建议。如果关键信息无法从图片确定，请在 analysis_quality 中明确提出需要用户确认的问题。最后提供从当前餐后开始的未来24小时三顿正餐计划，每餐应是可执行的完整组合，不要只输出一道菜或只推荐下一顿。

response_schema:
  type: object
  required:
    - identified_foods
    - nutrition_summary
    - nutrition_analysis
    - health_insights
    - recommendations
    - analysis_quality
  properties:
    identified_foods:
      type: array
      description: 图片中识别到的食物，按主要食物到配菜排序
      items:
        type: object
        required: [name, category, weight_g, calories, protein, carbs, fat, confidence]
        properties:
          name:
            type: string
          category:
            type: string
            enum: [staple, protein, vegetable, fruit, dairy, fat, beverage, snack, other]
          weight_g:
            type: number
            description: 可食部分重量的中位估计，单位克
          calories:
            type: number
            description: 热量中位估计，单位千卡
          protein:
            type: number
            description: 蛋白质中位估计，单位克
          carbs:
            type: number
            description: 碳水化合物中位估计，单位克
          fat:
            type: number
            description: 脂肪中位估计，单位克
          fiber:
            type: number
            description: 膳食纤维中位估计，单位克
          sodium:
            type: number
            description: 仅有合理依据时估算，单位毫克
          confidence:
            type: string
            enum: [high, medium, low]
          visual_evidence:
            type: string
            description: 支持识别结果的简短视觉依据
          notes:
            type: string
            description: 烹饪方式或关键不确定因素

    nutrition_summary:
      type: object
      required: [total_calories, total_protein, total_carbs, total_fat, total_fiber, total_weight]
      properties:
        total_calories:
          type: number
        total_protein:
          type: number
        total_carbs:
          type: number
        total_fat:
          type: number
        total_fiber:
          type: number
        total_weight:
          type: number
        calorie_range_low:
          type: number
          description: 考虑份量和烹饪油不确定性后的热量下界
        calorie_range_high:
          type: number
          description: 考虑份量和烹饪油不确定性后的热量上界
        estimate_note:
          type: string
          description: 一句话说明区间主要受什么因素影响

    nutrition_analysis:
      type: object
      required: [carbs_analysis, protein_analysis, fat_analysis, sodium_warning, overall_rating, overall_score]
      properties:
        carbs_analysis:
          type: object
          required: [rating, score, comment]
          properties:
            rating:
              type: string
              enum: [充足, 适中, 不足, 过量]
            score:
              type: integer
            comment:
              type: string
        protein_analysis:
          type: object
          required: [rating, score, comment]
          properties:
            rating:
              type: string
              enum: [充足, 适中, 不足, 过量]
            score:
              type: integer
            comment:
              type: string
        fat_analysis:
          type: object
          required: [rating, score, comment]
          properties:
            rating:
              type: string
              enum: [合理, 偏高, 偏低, 过高]
            score:
              type: integer
            comment:
              type: string
        sodium_warning:
          type: boolean
        sodium_comment:
          type: string
        overall_rating:
          type: string
          enum: [优秀, 良好, 一般, 需改善]
        overall_score:
          type: integer
        overall_comment:
          type: string
          description: 先说最重要的优点，再说最值得改善的一点

    health_insights:
      type: object
      required: [strengths, weaknesses, risk_level, risk_factors, uncertainty_notes]
      properties:
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        risk_level:
          type: string
          enum: [low, medium, high]
        risk_factors:
          type: array
          items:
            type: string
        uncertainty_notes:
          type: array
          items:
            type: string

    recommendations:
      type: object
      required: [summary, next_meal_tips, next_meal_recipes, action_items]
      properties:
        summary:
          type: string
          description: 40字以内，概括本餐最重要的下一步
        next_meal_tips:
          type: array
          minItems: 3
          maxItems: 3
          description: 从当前餐后开始、按时间顺序覆盖未来24小时的三顿正餐提示
          items:
            type: object
            required: [meal, suggestion, health_benefit]
            properties:
              meal:
                type: string
              suggestion:
                type: string
              health_benefit:
                type: string
        next_meal_recipes:
          type: array
          minItems: 3
          maxItems: 3
          description: 必须恰好给出未来24小时按时间排序的三顿正餐；每顿包含主食、蛋白质和蔬果的完整组合，并结合近7天记录去重
          items:
            type: object
            required: [meal_name, timing, total_calories, dishes, why_this_menu]
            properties:
              meal_name:
                type: string
                description: 使用明确时间语义，例如“今日午餐”“今日晚餐”“次日早餐”
              timing:
                type: string
                description: 建议用餐时间范围
              total_calories:
                type: number
              dishes:
                type: array
                items:
                  type: object
                  required: [name, portion, nutrition, health_benefit]
                  properties:
                    name:
                      type: string
                    portion:
                      type: string
                      description: 建议份量，例如“一掌心”或“熟重150g”
                    ingredients:
                      type: array
                      items:
                        type: string
                    cooking_steps:
                      type: array
                      items:
                        type: string
                    cooking_time:
                      type: string
                    nutrition:
                      type: object
                      required: [calories, protein]
                      properties:
                        calories:
                          type: number
                        protein:
                          type: number
                        carbs:
                          type: number
                        fat:
                          type: number
                    health_benefit:
                      type: string
              staple:
                type: object
                properties:
                  name:
                    type: string
                  portion:
                    type: string
                  calories:
                    type: number
              why_this_menu:
                type: string
                description: 说明如何衔接本餐、弥补营养缺口并避免与近7天饮食重复
        action_items:
          type: array
          items:
            type: object
            required: [priority, action, rationale]
            properties:
              priority:
                type: string
                enum: [high, medium, low]
              action:
                type: string
              rationale:
                type: string
        sleep_support:
          type: string
          description: 仅在用餐时间或食物特征与睡眠相关时给出
        hydration_reminder:
          type: string
          description: 仅在有明确需要时给出

    analysis_quality:
      type: object
      required: [overall_confidence, needs_user_confirmation, questions]
      properties:
        overall_confidence:
          type: string
          enum: [high, medium, low]
        needs_user_confirmation:
          type: boolean
        questions:
          type: array
          description: 最多两个能显著改善估算的问题，例如份量、烹饪油或隐藏食材
          items:
            type: string

user_context_template: |
  用户资料（仅用于个性化，不完整字段不要猜测）：
  - 性别：{gender}
  - 年龄：{age}
  - 体重：{weight}kg
  - 身高：{height}cm
  - 健康目标：{health_goal}
  - 训练计划：{training_plan}
  最近7天饮食上下文（只用于平衡与去重，不要逐条复述）：
  {recent_meals}

meal_types:
  breakfast: 早餐
  lunch: 午餐
  dinner: 晚餐
  snack: 加餐

daily_reference:
  calories_male: 2000-2400
  calories_female: 1600-2000
  protein_per_kg: 1.0-1.2
  carbs_ratio: 0.50-0.60
  fat_ratio: 0.20-0.30
  fiber: 25-30
  sodium: 2000

meal_calorie_distribution:
  breakfast: 0.25-0.30
  lunch: 0.35-0.40
  dinner: 0.30-0.35
  snack: 0.05-0.10

json_instruction: |
  直接返回符合约定结构的 JSON，不要包含 Markdown。所有营养数值必须是数字而不是带单位的字符串。数组没有可靠内容时返回空数组，不要为了填满字段而编造。
